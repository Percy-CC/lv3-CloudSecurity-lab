<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC",Arial,sans-serif;font-size:14px;color:#1f2329;background:#f2f4f7}
body.big{font-size:17px}
button,input,select,textarea{font:inherit}
.top{background:#1b1f2a;color:#fff;display:flex;align-items:center;gap:18px;padding:0 16px;height:48px;position:sticky;top:0;z-index:5}
.top .logo{font-weight:700;color:#ff6a00;white-space:nowrap}
.top .stat{display:flex;gap:16px;margin-left:auto;font-size:13px;flex-wrap:wrap;align-items:center}
.top .stat b{color:#ffb27a}
.top select{padding:3px 6px}
.wrap{padding:16px;max-width:1280px;margin:0 auto}
.card{background:#fff;border:1px solid #e3e6eb;border-radius:4px;padding:16px;margin-bottom:14px}
h1,h2,h3{margin:0 0 10px}
h2{font-size:17px}h3{font-size:15px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #eceff3;vertical-align:middle}
th{background:#f7f8fa;font-weight:600;color:#555}
.btn{background:#1366ec;color:#fff;border:0;border-radius:3px;padding:7px 14px;cursor:pointer}
.btn:hover{background:#0e56c9}
.btn.sec{background:#fff;color:#1366ec;border:1px solid #1366ec}
.btn.warn{background:#ff6a00}
.btn.sm{padding:3px 10px;font-size:12px}
.btn.red{background:#d93026;color:#fff}
.btn.on{background:#1366ec;color:#fff}
input,select,textarea{border:1px solid #c9ced6;border-radius:3px;padding:6px 8px;background:#fff}
input[type=number]{width:110px}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;color:#fff}
.b-ok{background:#2ba471}.b-warn{background:#e8a200}.b-bad{background:#d93026}.b-off{background:#6b7280}
.bar{background:#e8ebf0;border-radius:3px;height:8px;width:90px;display:inline-block;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:#2ba471}
.mono{font-family:Consolas,monospace;font-size:12px}
.layout{display:flex;min-height:calc(100vh - 48px)}
.side{width:230px;background:#fff;border-right:1px solid #e3e6eb;padding:10px 0;flex-shrink:0}
.side .grp{font-size:12px;color:#8a919c;padding:10px 16px 4px}
.side a{display:block;padding:9px 16px;color:#333;cursor:pointer}
.side a:hover{background:#f2f6ff}
.side a.on{background:#e8f0ff;color:#1366ec;border-right:3px solid #1366ec}
.side .chk{margin:12px;padding:10px;background:#f7f8fa;border-radius:4px;font-size:12px;color:#555;line-height:1.7}
.dot{display:none;width:8px;height:8px;border-radius:50%;background:#d93026;margin-left:6px;vertical-align:middle}
.dot.on{display:inline-block}
.main{flex:1;padding:16px;min-width:0}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.chart{border:1px solid #e3e6eb;border-radius:4px;padding:8px;background:#fff}
.chart canvas{width:100%;height:110px;display:block}
.chart .ct{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.red{color:#d93026;font-weight:700}
.logbox{background:#10141c;color:#cfd6e4;border-radius:4px;padding:10px;height:380px;overflow:auto;font-family:Consolas,monospace;font-size:12px}
.ll{padding:2px 0 2px 6px;border-left:3px solid transparent;line-height:1.6;word-break:break-word}
.ll.sus{background:rgba(245,158,11,.12);border-left-color:#f59e0b}
.ll.ALERT{background:rgba(220,38,38,.16);border-left-color:#dc2626}
.ll .mt{color:#7d8799;margin-right:6px}
.lv{display:inline-block;min-width:50px;text-align:center;border-radius:3px;font-size:11px;padding:0 4px;margin-right:6px;color:#fff}
.lv-INFO{background:#4b5563}.lv-WARN{background:#d97706}.lv-ALERT{background:#dc2626}.lv-SHIELD{background:#059669}
.kw{background:#7c4a03;color:#ffe2b0;padding:0 2px;border-radius:2px}
.cnt{background:#334155;color:#fff;border-radius:8px;padding:0 7px;margin-left:6px;font-size:11px}
.ln{color:#7dd3c0;margin:2px 0 0 56px;font-size:12px}
.banner{background:#fff4e5;border:1px solid #ffb27a;color:#7a3d00;padding:10px 14px;border-radius:4px;margin-bottom:12px}
.note{color:#666;font-size:13px;margin:4px 0 10px}
.row{margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row label{min-width:150px}
.pill{display:inline-block;background:#eef2f9;border-radius:10px;padding:1px 8px;font-size:12px;margin-right:4px}
.center{max-width:780px;margin:30px auto}
.msg{padding:8px 12px;border-radius:3px;margin-top:10px}
.msg.ok{background:#e6f7ee;color:#116b3f}.msg.err{background:#fdecea;color:#a31d14}
.foot{text-align:center;color:#8a919c;font-size:12px;padding:14px}
abbr{text-decoration:underline dotted;cursor:help}
details.help{background:#f4f8ff;border:1px solid #d5e3ff;border-radius:4px;padding:8px 12px;margin:0 0 12px}
details.help summary{cursor:pointer;color:#1366ec;font-weight:600}
details.help ul{margin:8px 0 0 18px;padding:0}
.adv{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;color:#fff}
.adv-close{background:#d93026}.adv-limit,.adv-internal,.adv-dns{background:#e8a200}.adv-open{background:#2ba471}.adv-unk{background:#6b7280}
#hintpanel{display:none;background:#f4f8ff;border:1px solid #c9dcff;border-left:5px solid #1366ec;border-radius:4px;padding:10px 12px;margin-top:10px}
#toast{position:fixed;z-index:40;background:#fff;border:1px solid #c9ced6;border-radius:6px;box-shadow:0 6px 22px rgba(0,0,0,.25);padding:12px 14px;max-width:360px;display:none}
#toast{right:14px;bottom:14px;border-left:5px solid #2ba471}
#hintpanel p,#toast p{margin:6px 0}
.hp-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
#tourhole{position:fixed;display:none;border-radius:6px;box-shadow:0 0 0 9999px rgba(10,15,30,.62);pointer-events:none;z-index:50;border:2px solid #ff6a00}
#tourbox{position:fixed;display:none;z-index:60;background:#fff;border-radius:6px;padding:14px;width:380px;max-width:calc(100% - 24px);max-height:calc(100vh - 16px);overflow:auto;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#tourbox ul{margin:8px 0 8px 18px;padding:0}
#tourbox .tb{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
table.plain td,table.plain th{padding:6px 8px;font-size:13px}
@media(max-width:680px){
 .top{height:auto;min-height:48px;flex-wrap:wrap;padding:8px 12px;gap:10px}
 .top .stat{width:100%;margin-left:0;gap:8px}
 .layout{display:block}
 .side{width:100%;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid #e3e6eb}
 .side .grp{flex-basis:100%}
 .side a{display:inline-block;padding:8px 10px}
 .side .chk{display:none}
 .main{padding:10px}
 table{display:block;max-width:100%;overflow-x:auto;white-space:nowrap}
 #toast{max-width:calc(100% - 28px)}
}
</style>
</head>

<div id="app"></div>
<div id="toast"></div>
<div id="tourhole"></div>
<div id="tourbox"></div>

 "atk.ssh.ln": "Explanation: the same source IP keeps failing to log in over SSH. Looks like brute force.",

 "guide.fw": "Purpose: protects traffic going in and out of the whole VPC. It raises an alert or blocks traffic when it goes over a limit.|Key fields: enable traffic protection, traffic threshold (Mbps), and the action when the threshold is exceeded.|Common mistakes: choosing only \"Alert only\" does not stop an attack; a threshold below normal traffic (about 40 Mbps) blocks normal users.",
 "guide.sg": "Purpose: decides which sources can reach which port of this server over TCP. It works like a virtual firewall for one instance.|Key fields: port and allowed source (CIDR). 0.0.0.0/0 means the whole Internet.|Common mistakes: opening ports that are not needed, opening admin port 22 to the whole Internet, or deleting port 80 or 443 that the website needs.",
 "guide.eip": "Purpose: an EIP gives a resource a public address; a NAT gateway lets private resources go out to the Internet one-way.|Key fields: attach EIP, access the Internet through NAT gateway (SNAT).|Common mistakes: attaching an EIP to a database; detaching the EIP of the web server so users cannot reach it.",
 "guide.dns": "Purpose: maps a web address (domain name) to an IP address.|Key fields: host record, type (A), record value.|Common mistakes: pointing a record to an IP you do not own, which sends users to a fake site.",
 "guide.rl": "Purpose: limits how many requests each user can send in a period of time. Requests over the limit get 429 Too Many Requests.|Key fields: enable rate limiting, limit per user per minute.|Common mistakes: a limit that is too high cannot stop a flood; a limit below 5 blocks normal users.",
 "guide.pr": "Purpose: sets in advance what the AI may and may not do.|Key fields: limit the scope, reject instruction override, maximum input length, blocked keywords.|Common mistakes: thinking rules are foolproof. Rules only reduce risk and must be combined with rate limiting, logging and other measures.",
 "guide.cost": "Purpose: sets a budget and sends a notice or acts automatically when usage is close to or over it.|Key fields: budget limit, alert percentage, action when the budget is exceeded.|Common mistakes: not setting a budget, or choosing \"Do nothing\" when it is exceeded.",
 "guide.lg": "Purpose: records who did what and when, for investigation and auditing.|Key fields: enable logging, mask personal data (Mask PII), retention days.|Common mistakes: turning logging off so nothing can be traced afterwards; storing plain-text personal data in logs.",

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function hashSeed(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuf(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const openSrc=s=>['0.0.0.0/0','0.0.0.0','*','any'].includes(String(s).trim().toLowerCase());
function validCidr(value){
 const parts=String(value).trim().split('/');
 if(parts.length>2)return false;
 const octets=parts[0].split('.');
 if(octets.length!==4||octets.some(x=>!/^\d{1,3}$/.test(x)||Number(x)>255))return false;
 return parts.length===1||(/^\d{1,2}$/.test(parts[1])&&Number(parts[1])<=32);
}

function newGame(o){
 const diff=o.practice?'easy':o.diff;
 const rng=mulberry32(hashSeed(o.seed+'|'+diff)),D=Object.assign({},DIFF[diff]);
 const net=shuf(ATK_KEYS.filter(k=>ATK[k].layer==='net'),rng),app=shuf(ATK_KEYS.filter(k=>ATK[k].layer==='app'),rng);
 const order=[];let i=0,j=0,turn=rng()<.5;
 while(i<net.length||j<app.length){
  if((turn&&i<net.length)||j>=app.length)order.push(net[i++]);
  else order.push(app[j++]);
  if(i<net.length&&j<app.length)turn=!turn;
 }
 const queue=order.slice(0,D.quota);
 G={seed:o.seed,diff,D,rng,nick:o.nick||'',cls:o.cls||'',tut:!!o.tut,practice:!!o.practice,demo:!!o.demo,t:0,servers:makeServers(),
  fw:{enabled:false,thr:1000,action:'alert'},fwDef:{enabled:false,thr:1000,action:'alert'},queue,total:queue.length,nextSpawn:FIRST_AT,lastFix:-999,
  attacks:[],score:0,spent:0,events:[],notes:[],view:'home',cur:null,tab:'mon',firstAtk:null,over:false,reason:'',logf:'all',merge:D.merge,mistakes:0,hintHtml:''};
 G.servers.forEach(s=>{for(let k=0;k<60;k++)pushMetrics(s,false)});
}
const active=()=>G.attacks.filter(a=>!a.fixed&&!a.dead);
function addEv(text,d){if(G.practice||G.demo)return;G.score+=d;G.events.push({t:G.t,text,d})}
function penalty(key,d,p){addEv(t(key,p),-Math.round(d*G.D.pen));G.mistakes++}
function effOf(id){const o={};for(const a of active()){const e=ATK[a.type].eff[id];if(e)for(const k in e)o[k]=(o[k]||0)+e[k]}return o}
function pushMetrics(s,real){
 const e=real?effOf(s.id):{};const r=()=>0.85+Math.random()*0.3;
 const m={net:Math.max(0,s.b.net*r()+(e.net||0)),req:Math.max(0,s.b.req*r()+(e.req||0)),cpu:Math.min(100,Math.max(0,s.b.cpu*r()+(e.cpu||0))),cost:0};
 const rate=0.1+(e.cost||0);m.cost=rate*60;s.cur=m;
 for(const k in m){s.hist[k].push(m[k]);if(s.hist[k].length>60)s.hist[k].shift()}
 return rate;
}
function logLine(s,raw,sus,type){
 const m=raw.match(/^(\w+)\s+([\s\S]*)$/);
 s.logs.push({t:G.t,lvl:m?m[1]:'INFO',msg:m?m[2]:raw,sus:!!sus,type:type||''});
 if(sus)s.sus++;if(s.logs.length>400)s.logs.shift();
}
const NORMAL={
 'web-01':()=>`INFO  GET ${['/index.html','/courses','/login','/lab'][ri(0,3)]} 200 client=192.0.2.${ri(1,250)}`,
 'api-gw':()=>`INFO  POST /v1/chat 200 ${ri(8,40)}ms client=192.0.2.${ri(1,250)}`,

function spawn(type){
 type=type||G.queue.shift();const d=ATK[type];
 const a={type,target:d.target,spawnT:G.t,reported:false,fixed:false,dead:false,hint:0,hint3:false,ip:`198.51.100.${ri(2,250)}`,fixT:null,repOK:false};
 G.attacks.push(a);if(!G.firstAtk)G.firstAtk=a;
 if(d.onSpawn)d.onSpawn();
 G.notes.unshift({t:G.t,text:t('note',{id:d.target}),atk:a});
}
function resetVuln(k){
 const w=sv('web-01'),ai=sv('ai-bot');
 if(k==='ddos')G.fw=clone(G.fwDef);
 if(k==='portscan'||k==='ssh')w.cfg.sg=clone(w.def.sg);
 if(k==='dbexpose')sv('db-01').cfg.eip=clone(sv('db-01').def.eip);
 if(k==='apiflood')sv('api-gw').cfg.rl=clone(sv('api-gw').def.rl);
 if(k==='inject')ai.cfg.pr=clone(ai.def.pr);
 if(k==='cost')ai.cfg.cost=clone(ai.def.cost);

function triggerAttack(k){if(active().some(a=>a.type===k))return;resetVuln(k);spawn(k)}
function checkFixes(){
 for(const a of active()){
  if(ATK[a.type].fixed()){
   a.fixed=true;a.fixT=G.t;G.lastFix=G.t;
   let bonus=Math.max(0,20-Math.floor((G.t-a.spawnT)/G.D.speed));if(a.hint3)bonus=0;
   const nm=t('atk.'+a.type+'.n');
   addEv(t('ev.solved',{n:nm,b:bonus}),30+bonus);
   const s=sv(a.target);if(s.cfg.lg.enabled)logLine(s,'SHIELD '+t('log.shield',{n:nm}),false);
   showToast(`<b>${esc(t('toast.h',{n:nm}))}</b><p>${esc(t('toast.why'))}</p><p>${esc(t('atk.'+a.type+'.w'))}</p>`);
  }
 }
}
function tick(){
 if(!G||G.over||G.demo)return;
 G.t++;const D=G.D;
 if(!G.practice&&G.queue.length&&G.t>=G.nextSpawn&&active().length<D.maxActive&&G.t-G.lastFix>=D.cool){
  spawn();G.nextSpawn=G.t+D.gap[0]+Math.floor(G.rng()*(D.gap[1]-D.gap[0]+1));
 }
 let totalRate=0;
 for(const s of G.servers){
  totalRate+=pushMetrics(s,true);
  if(s.cfg.lg.enabled){
   if(Math.random()<.35)logLine(s,NORMAL[s.id](),false);
   for(const a of active()){
    if(a.target!==s.id)continue;
    const n=Math.random()<.4?2:1;
    for(let k=0;k<n;k++)logLine(s,ATK[a.type].log(a,s.cfg.lg.mask),!(a.type==='leak'&&s.cfg.lg.mask),a.type);
   }
  }
  const drain=active().filter(a=>a.target===s.id).length*D.drain;
  if(drain>0)s.health=Math.max(0,s.health-drain);else s.health=Math.min(100,s.health+RECOVER);
  if(s.health<=0&&!s.off){s.off=true;penalty('ev.off',25,{id:s.id})}
  if(s.off&&s.health>=30)s.off=false;
 }
 G.spent+=totalRate;
 checkFixes();
 if(!G.practice){
  const avg=avgHealth();
  if(G.t>=GAME_SEC)endGame('time');
  else if(G.spent>=START_BUDGET)endGame('budget');
  else if(avg<20)endGame('health');
  else if(!G.queue.length&&!active().length)endGame('done');
 }
 refresh();
}

}

function drawCharts(){
 const s=sv(G.cur),bads=[];
 for(const c of CH){
  const cv=$('#cv-'+c[0]);if(!cv)return;const d=s.hist[c[0]];
  const base=c[0]==='cost'?6:s.b[c[0]];const warn=c[0]==='cost'?30:Math.max(base*c[2],c[0]==='cpu'?70:base*c[2]);
  const last=d[d.length-1];const bad=last>warn;if(bad)bads.push(t(c[1]).replace(/\s*[(（].*$/,''));
  $('#v-'+c[0]).innerHTML=bad?`<span class="red">${last.toFixed(1)}</span>`:last.toFixed(1);
  const x=cv.getContext('2d'),w=cv.width,h=cv.height;x.clearRect(0,0,w,h);
  const mx=Math.max(...d,base*1.5,1),Y=v=>h-4-(v/mx)*(h-10);
  x.fillStyle='rgba(43,164,115,.14)';x.fillRect(0,Y(base*1.15),w,Y(base*.85)-Y(base*1.15));
  x.strokeStyle='#e5e8ee';x.lineWidth=1;x.beginPath();for(let i=1;i<4;i++){x.moveTo(0,h*i/4);x.lineTo(w,h*i/4)}x.stroke();
  x.strokeStyle=bad?'#d93026':'#1366ec';x.lineWidth=2;x.beginPath();
  d.forEach((v,i)=>{const px=i*(w/59),py=Y(v);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
 }
 const m=$('#malert');if(m)m.innerHTML=bads.length?`<span class="red">${esc(t('mon.alert',{list:bads.join(t('mon.sep'))}))}</span>`:esc(t('mon.normal'));
}
const KW=/(Failed password|dst_port=\S+|SYN_RECV=\d+|distinct_src_ips=\d+|Ignore all previous instructions|system prompt|est_cost=\S+|tokens_in=\d+|tokens_out=\d+|\d+ req\/min|phone is [\d ]+|email \S+@\S+|changed [\d.]+ -> [\d.]+|public EIP[^)]*|auth failed|inbound \d+ Mbps)/g;
function hl(raw,on){
 if(!on)return esc(raw);
 let out='',last=0,m;KW.lastIndex=0;
 while((m=KW.exec(raw))){out+=esc(raw.slice(last,m.index))+'<span class="kw">'+esc(m[0])+'</span>';last=m.index+m[0].length}
 return out+esc(raw.slice(last));
}
function renderLogs(){
 const s=sv(G.cur),box=$('#logbox');if(!box)return;
 const D=G.D;
 if(!s.cfg.lg.enabled){box.textContent=t('log.disabled');return}
 const f=($('#lf')&&$('#lf').value||'').toLowerCase();
 let arr=s.logs.slice(-250).filter(e=>{
  if(G.logf==='warn'&&!(e.lvl==='WARN'||e.lvl==='ALERT'))return false;
  if(G.logf==='sus'&&!e.sus)return false;
  return !f||(e.lvl+' '+e.msg).toLowerCase().includes(f);
 });
 let groups;
 if(G.merge){
  const map=new Map();
  arr.forEach((e,i)=>{const key=e.lvl+'|'+e.msg.replace(/\d+/g,'#');const g=map.get(key);if(g){g.n++;g.e=e;g.i=i}else map.set(key,{e,n:1,i})});
  groups=[...map.values()].sort((a,b)=>a.i-b.i);
 }else groups=arr.map((e,i)=>({e,n:1,i}));
 groups=groups.slice(-120);
 const atBottom=box.scrollTop+box.clientHeight>=box.scrollHeight-30;
 box.innerHTML=groups.map(g=>{
  const e=g.e;
  return `<div class="ll ${e.sus?'sus ':''}${e.lvl==='ALERT'?'ALERT':''}"><span class="mt">[${mmss(e.t)}]</span><span class="lv lv-${e.lvl}">${e.lvl}</span>${hl(e.msg,D.kw&&e.sus)}${g.n>1?`<span class="cnt">×${g.n}</span>`:''}${D.annot&&e.sus&&e.type?`<div class="ln">${esc(t('atk.'+e.type+'.ln'))}</div>`:''}</div>`;
 }).join('');
 if(atBottom)box.scrollTop=box.scrollHeight;
 s.susSeen=s.sus;
 const ib=$('#ipbox');
 if(ib){
  const cnt={};s.logs.forEach(e=>{const m=e.msg.match(/(?:\b(?:src|host|client)=|\bfrom\s+)(\d{1,3}(?:\.\d{1,3}){3})/i);if(m&&!m[1].startsWith('10.'))cnt[m[1]]=(cnt[m[1]]||0)+1});
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
  ib.innerHTML=`<b>${t('log.ipbox')}</b>${t('ui.colon')}`+(top.length?top.map(x=>`<span class="pill mono">${x[0]} × ${x[1]}</span>`).join(' '):t('log.ipnone'));
 }
}

 afterApply('lg');
},
end(){if(confirm(t('end.confirm')))endGame('quit')},
restart(){hidePanels();G=null;renderStart()},
again(){const o={seed:G.seed,diff:G.diff,nick:G.nick,cls:G.cls,tut:G.tut,practice:false};hidePanels();newGame(o);renderShell();updateTop();renderHome();renderBanner();startTimer()},
tourprev(){tourGo(Math.max(0,TS.i-1))},
tournext(){if(TS.i>=TOUR.length-1)tourEnd(true);else tourGo(TS.i+1)},
tourskip(){tourEnd(false)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=H[el.dataset.a];if(f){e.preventDefault();f(el)}});
document.addEventListener('change',e=>{
 const c=e.target;
 if(c.id==='lbd'||c.id==='lbs')renderLB();
 else if(c.id==='diff')updDiffDesc();
 else if(c.classList&&c.classList.contains('sgp'))updSgRow(c.closest('tr'));
});
document.addEventListener('input',e=>{const c=e.target;if(c.classList&&c.classList.contains('sgp'))updSgRow(c.closest('tr'))});
document.addEventListener('input',e=>{if(e.target.id==='seed')renderLB()});

/* ========== 介面導覽（使用示範資料，不影響正式遊戲） ========== */
let TS={on:false,i:0};
function tgo(id,tab){
 if(id==='home'){G.view='home';G.cur=null;renderHome()}
 else{G.view='console';G.cur=id;G.tab=tab;renderConsole()}
}
const TOUR=[
 {k:'top',sel:'#topbar',go:()=>tgo('home')},
 {k:'table',sel:'#hometable tr:first-child',go:()=>tgo('home')},
 {k:'status',sel:'#hometable tr:nth-child(2) td:nth-child(2)',go:()=>tgo('home')},
 {k:'notes',sel:'#notescard',go:()=>tgo('home')},
 {k:'side',sel:'.side .grp:first-child',go:()=>tgo('web-01','mon')},
 {k:'mon',sel:'#tabbody .chart:first-child',go:()=>tgo('web-01','mon')},
 {k:'logs',sel:'#tabbody .row',go:()=>tgo('web-01','logs')},
 {k:'report',sel:'#tabbody h3',go:()=>tgo('web-01','report')},
 {k:'fw',tool:1,go:()=>tgo('web-01','fw')},{k:'sg',tool:1,go:()=>tgo('web-01','sg')},{k:'eip',tool:1,go:()=>tgo('web-01','eip')},
 {k:'dns',tool:1,go:()=>tgo('dns-zone','dns')},{k:'rl',tool:1,go:()=>tgo('api-gw','rl')},{k:'pr',tool:1,go:()=>tgo('ai-bot','pr')},
 {k:'cost',tool:1,go:()=>tgo('ai-bot','cost')},{k:'lg',tool:1,go:()=>tgo('ai-bot','lg')},
 {k:'hint',sel:'#hintbtn',go:()=>tgo('web-01','mon')}
];
function startTour(){
 stopTimer();hidePanels();
 newGame({seed:'demo',diff:'easy',demo:true});renderShell();updateTop();
 const w=sv('web-01');
 for(let i=0;i<10;i++)logLine(w,NORMAL['web-01'](),false);
 for(let i=0;i<6;i++){logLine(w,ATK.portscan.log({ip:'198.51.100.23'}),true,'portscan');if(i%2)logLine(w,NORMAL['web-01'](),false)}
 TS={on:true,i:0};tourGo(0);
}
function tourGo(i){
 TS.i=i;const st=TOUR[i];st.go();
 requestAnimationFrame(tourPlace);
}
function tourPlace(){
 if(!TS.on)return;
 const st=TOUR[TS.i],hole=$('#tourhole'),box=$('#tourbox');
 const el=document.querySelector(st.tool?'#tabbody>.card>h3':st.sel);
 const title=st.tool?t('tool.'+st.k):t('tour.'+st.k+'.t');
 const body=st.tool?'<ul>'+t('guide.'+st.k).split('|').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p class="note">'+esc(t('tour.try'))+'</p>':'<p>'+esc(t('tour.'+st.k+'.b'))+'</p>';
 const last=TS.i>=TOUR.length-1;
 box.innerHTML=`<div class="note" style="margin:0">${esc(t('tour.step',{i:TS.i+1,n:TOUR.length}))}</div><h3 style="margin:4px 0">${esc(title)}</h3>${body}
 <div class="tb">${TS.i>0?`<button class="btn sec sm" data-a="tourprev">${t('tour.prev')}</button>`:''}<button class="btn sec sm" data-a="tourskip">${t('tour.skip')}</button><button class="btn sm warn" data-a="tournext">${last?t('tour.done'):t('tour.next')}</button></div>`;
 box.style.display='block';
 if(el){
  el.scrollIntoView({block:'nearest'});
  const r=el.getBoundingClientRect(),vh=window.innerHeight,top=Math.max(4,r.top-6),bot=Math.min(vh-4,r.bottom+6);
  hole.style.display='block';hole.style.left=Math.max(4,r.left-6)+'px';hole.style.top=top+'px';
  hole.style.width=Math.max(20,Math.min(window.innerWidth-8,r.width+12))+'px';hole.style.height=Math.max(20,bot-top)+'px';
  const bh=box.offsetHeight,bw=box.offsetWidth;let y;
  if(bot+bh+14<vh)y=bot+10;else if(top-bh-14>0)y=top-bh-10;else y=vh-bh-12;
  let x=Math.min(Math.max(12,r.left),window.innerWidth-bw-12);
  box.style.top=Math.max(8,y)+'px';box.style.left=x+'px';
 }else{hole.style.display='none';box.style.top='80px';box.style.left='12px'}
}
function tourEnd(done){
 TS.on=false;$('#tourhole').style.display='none';$('#tourbox').style.display='none';
 if(done)lsSet('cs_tour','1');
 stopTimer();G=null;hidePanels();renderStart();
}
window.addEventListener('resize',()=>{if(TS.on)tourPlace()});

/* ========== 結束畫面 ========== */
function endGame(reason){
 if(G.over)return;G.over=true;G.reason=reason;stopTimer();
 const hp=Math.round(avgHealth()),bud=Math.max(0,Math.round(START_BUDGET-G.spent));
 const done=!G.queue.length&&!active().length;
 const bHealth=hp*2,bBudget=Math.floor(bud/10),bDone=(done&&reason!=='health'&&reason!=='budget')?50:0;
 const total=G.score+bHealth+bBudget+bDone;
 saveLB({nick:G.nick,cls:G.cls,seed:G.seed,diff:G.diff,score:total,date:new Date().toLocaleDateString('en-CA')});
 const rev=ATK_KEYS.map(k=>{
  const a=G.attacks.find(x=>x.type===k);
  const st=!a?`<span class="pill">${t('end.notshown')}</span>`:a.fixed?`<span class="badge b-ok">${t('end.fixed',{s:a.fixT-a.spawnT})}</span>`:`<span class="badge b-bad">${t('end.unfixed')}</span>`;
  return `<tr><td>${t('layer_'+ATK[k].layer)}</td><td><b>${t('atk.'+k+'.n')}</b></td><td>${st}${a&&a.repOK?` <span class="pill">${t('end.rep')}</span>`:''}</td><td>${t('tool.'+ATK[k].tool)}</td><td>${t('atk.'+k+'.w')}</td></tr>`}).join('');
 hidePanels();
 $('#app').innerHTML=`<div class="top"><span class="logo">☁ ${t('title')}</span></div><div class="wrap">
 <div class="card"><h2>${t('end.title',{r:t('end.r.'+reason)})}</h2><table>
 <tr><td>${t('end.score')}</td><td>${G.score}</td></tr><tr><td>${t('end.health',{hp})}</td><td>+${bHealth}</td></tr>
 <tr><td>${t('end.budget',{b:bud})}</td><td>+${bBudget}</td></tr><tr><td>${t('end.done')}</td><td>+${bDone}</td></tr>
 <tr><th>${t('end.total',{seed:esc(G.seed),d:t('diff.'+G.diff)})}</th><th>${total}</th></tr></table>
 <div class="row"><button class="btn" data-a="again">${t('end.again')}</button><button class="btn sec" data-a="restart">${t('end.back')}</button></div></div>
 <div class="card"><h3>${t('end.review')}</h3><table><tr><th>${t('end.th.layer')}</th><th>${t('end.th.atk')}</th><th>${t('end.th.res')}</th><th>${t('end.th.tool')}</th><th>${t('end.th.why')}</th></tr>${rev}</table></div>
 <div class="card"><h3>${t('end.events')}</h3><table><tr><th>${t('end.th.time')}</th><th>${t('end.th.ev')}</th><th>${t('end.th.sc')}</th></tr>${G.events.map(e=>`<tr><td>${mmss(e.t)}</td><td>${esc(e.text)}</td><td>${e.d>0?'+':''}${e.d}</td></tr>`).join('')||`<tr><td colspan="3">${t('end.noev')}</td></tr>`}</table></div>
 <div class="card"><h3>${t('end.lb')}</h3>${lbControls()}</div></div>`;
}
renderStart();
</script>
</body>
</html>
